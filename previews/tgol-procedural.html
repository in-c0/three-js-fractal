<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090a">
<title>The Geometry of Life</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05090a}body{overflow:hidden;color:#f1ece2;-webkit-font-smoothing:antialiased}.hero{position:relative;width:100%;height:100dvh;min-height:540px;overflow:hidden;background:radial-gradient(64% 82% at 80% 48%,rgba(27,63,57,.17),transparent 66%),#05090a}.tree{position:absolute;right:-7vw;top:-4vh;width:72vw;height:108vh;pointer-events:none;filter:drop-shadow(0 0 5px rgba(234,226,202,.08));transform-origin:96% 86%;animation:sway 19s ease-in-out infinite alternate}.tree svg{width:100%;height:100%;overflow:visible}.branch{fill:none;stroke:#ddd4bd;stroke-linecap:round}.twig{fill:none;stroke:#a8c3ba;stroke-linecap:round;opacity:.54}.bud{fill:#efe6cc;opacity:.86}.field{fill:none;stroke:#72958e;stroke-width:.55;stroke-dasharray:2 12;opacity:.09}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#05090a 0%,rgba(5,9,10,.97) 5%,rgba(5,9,10,.72) 17%,rgba(5,9,10,.13) 34%,transparent 46%)}@keyframes sway{from{transform:translate3d(-2px,2px,0) rotate(-.04deg)}to{transform:translate3d(2px,-2px,0) rotate(.055deg)}}.copy{position:absolute;z-index:4;left:clamp(46px,4.8vw,92px);top:50%;transform:translateY(-40%);width:min(44vw,720px)}h1{margin:0;font-family:Didot,"Bodoni MT","Times New Roman",serif;font-weight:400;font-size:clamp(58px,5.15vw,99px);line-height:.95;letter-spacing:.145em;text-transform:uppercase}.sub{margin:25px 0 0;font-family:Didot,Georgia,serif;font-size:clamp(18px,1.45vw,28px);line-height:1.3;letter-spacing:.045em;color:rgba(235,230,220,.8)}.meta{margin:34px 0 0;font:600 clamp(8px,.62vw,11px)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.31em;color:rgba(134,170,163,.82);white-space:nowrap}.status{position:absolute;z-index:5;right:18px;bottom:16px;color:rgba(220,230,226,.46);font:500 9px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.off .tree{animation:none;transform:none}
@media(max-width:980px){.copy{left:24px;right:18px;top:9vh;width:auto;transform:none}h1{font-size:clamp(42px,12vw,72px);letter-spacing:.095em}.sub{margin-top:17px;font-size:clamp(16px,4.35vw,22px)}.meta{margin-top:22px;font-size:7px;letter-spacing:.18em;white-space:normal;max-width:88%}.tree{right:-46vw;top:23vh;width:145vw;height:82vh;animation:none}.veil{background:linear-gradient(180deg,#05090a 0%,rgba(5,9,10,.95) 12%,rgba(5,9,10,.55) 28%,rgba(5,9,10,.04) 52%,transparent 72%)}.status{display:none}}
@media(prefers-reduced-motion:reduce){.tree{animation:none!important}}
</style>
</head>
<body>
<main class="hero">
<div class="tree"><svg id="tree" viewBox="0 0 1000 1000" aria-hidden="true"><g id="branches"></g><g id="twigs"></g><g id="buds"></g><path class="field" d="M70 925C88 570 270 210 610 45C806-50 1013 45 1080 224"/><path class="field" d="M145 785C385 920 742 788 928 525C1034 376 1067 218 1000 79"/></svg><div class="veil"></div></div>
<section class="copy"><h1>The Geometry<br>of Life</h1><p class="sub">Simulating the Hidden Beauty of Nature</p><p class="meta">Morphogenesis × Field Dynamics × Computational Mechanics</p></section>
<div class="status">low-energy generative geometry</div>
</main>
<script>
(()=>{const NS='http://www.w3.org/2000/svg',B=document.getElementById('branches'),T=document.getElementById('twigs'),U=document.getElementById('buds');let seed=87123;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);const path=(g,d,w,cls,o=1)=>{let p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',cls);p.setAttribute('stroke-width',w);p.setAttribute('opacity',o);g.appendChild(p)};const bud=(x,y,r,o)=>{let c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);c.setAttribute('opacity',o);c.setAttribute('class','bud');U.appendChild(c)};function grow(x,y,a,len,w,depth,bias){if(depth<=0||len<4){if(rnd()>.18)bud(x,y,.75+rnd()*1.6,.45+rnd()*.5);return}let bend=(rnd()-.5)*.16+bias*.018,na=a+bend;let ex=x+Math.cos(na)*len,ey=y+Math.sin(na)*len;let mx=(x+ex)/2+Math.sin(na)*(rnd()-.5)*len*.13,my=(y+ey)/2-Math.cos(na)*(rnd()-.5)*len*.13;path(depth>3?B:T,`M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,Math.max(.42,w),depth>3?'branch':'twig',depth>3?.72:.48);let children=depth>5?(rnd()<.62?2:3):(rnd()<.78?2:1);for(let i=0;i<children;i++){let spread=(i-(children-1)/2)*(.31+rnd()*.22)+(rnd()-.5)*.18;grow(ex,ey,na+spread,len*(.70+rnd()*.08),w*.72,depth-1,bias+(rnd()-.5)*.7)}if(depth<5&&rnd()<.25)bud(ex,ey,.55+rnd()*.8,.28+rnd()*.42)}
// dense filament trunk: several near-parallel recursive trees sharing one flow
for(let i=0;i<10;i++){let y=945+i*1.1;grow(935+i*.7,y,-2.02+(i-4.5)*.003,116-i*.9,8.6-i*.42,8,(i-4.5)*.09)}
// secondary boughs give the broad, vascular crown seen in the target render
for(let i=0;i<8;i++){let a=-2.35+i*.145;grow(850+i*4,815-i*18,a,86+i*4,4.5,7,(i-3.5)*.12)}
})();
</script>
</body></html>
